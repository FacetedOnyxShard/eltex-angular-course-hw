<form [formGroup]="articleForm" class="form" id="form--bright">
  <div>
    <h3 class="form__header">Добавить статью</h3>

    <fieldset [disabled]="isSubmitting" class="fieldset">
      <div class="form__element">
        <label for="form-title-input">Заголовок</label>
        <input
          id="form-title-input"
          type="text"
          formControlName="title"
          placeholder="Заголовок"
          class="form__input form__input--bright"
          [class.form__input--invalid]="
            titleControl?.invalid && titleControl?.touched
          "
        />
        <div
          class="form__error"
          *ngIf="titleControl?.invalid && titleControl?.touched"
        >
          <span *ngIf="titleControl?.errors?.['required']"
            >Заголовок обязателен</span
          >
          <span *ngIf="titleControl?.errors?.['minlength']"
            >Минимум 3 символа</span
          >
        </div>
      </div>

      <div class="form__element">
        <label for="form-article-content">Текст статьи</label>
        <textarea
          id="form-article-content"
          formControlName="content"
          placeholder="Текст статьи"
          class="form__input form__input--bright form__input--tall"
          [class.form__input--invalid]="
            contentControl?.invalid && contentControl?.touched
          "
        ></textarea>
        <div
          class="form__error"
          *ngIf="contentControl?.invalid && contentControl?.touched"
        >
          <span *ngIf="contentControl?.errors?.['required']"
            >Текст статьи обязателен</span
          >
          <span *ngIf="contentControl?.errors?.['minlength']"
            >Минимум 10 символов</span
          >
        </div>
      </div>
    </fieldset>
  </div>

  <section class="buttons">
    <button
      type="button"
      class="form__submit-button form__submit-button--bouncing"
      [class.form__submit-button--loading]="isSubmitting"
      [disabled]="isSubmitting"
      (click)="onSubmit()"
    >
      {{ isSubmitting ? "Добавление..." : "Добавить" }}
    </button>
    <button
      type="button"
      class="form__cancel-button form__cancel-button--bouncing"
      [disabled]="isSubmitting"
      (click)="onCancel()"
    >
      Отмена
    </button>
  </section>
</form>
