<form action="#" method="post" onsubmit="event.preventDefault()" class="form">
  <h3 class="form__header">Добавить статью</h3>

  <div class="form__element">
    <label for="email-input" class="">Заголовок</label>
    <input
      id="email-input"
      name="email"
      type="text"
      placeholder="Заголовок"
      class="form__input form__input--bright"
      required
    />
  </div>

  <div class="form__element">
    <label for="form-content-textarea" class="">Текст статьи</label>
    <textarea
      name="content"
      id="form-content-textarea"
      placeholder="Текст статьи"
      class="form__input form__input--bright form__input--tall"
      required
    ></textarea>
  </div>

  <section class="buttons">
    <button
      type="submit"
      class="form__submit-button form__submit-button--bouncing"
      id="dialog-form-add-post-button"
    >
      Добавить
    </button>
    <button
      type="button"
      class="form__cancel-button form__cancel-button--bouncing"
      id="dialog-form-cancel-button"
    >
      Отмена
    </button>
  </section>
</form>
