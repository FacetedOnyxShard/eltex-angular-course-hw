<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Блог</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link
      rel="preload"
      href="src/styles/font.css"
      as="font"
      type="font/woff2"
    />

    <link rel="stylesheet" href="src/styles/main.css" />
  </head>

  <body class="page">
    <div class="header-container" id="header-placeholder"></div>

    <main class="main-content">
      <section class="blog">
        <section class="hello-section">
          <div class="hello-section__text">
            <h2 class="hello-section__title">My blogs</h2>
            <p class="hello-section__paragraph">
              Lorem occaecat proident excepteur commodo et nulla eiusmod. Elit
              esse aute officia dolor elit aute
            </p>
          </div>
          <img src="src/assets/images/text-circle-design-element.png" alt="" />
        </section>

        <section class="posts-section" id="posts-section">
          <div class="placeholder-container" id="article-placeholder">
            <p class="placeholder__text">Нет статей</p>
          </div>

          <template>
            <article class="card card--big" id="first-article">
              <img
                class="card__delete-article-button"
                id="first-article__delete-article-button"
                src="src/assets/icons/delete.svg"
                alt=""
              />

              <img
                src="src/assets/images/empty-picture.png"
                alt=""
                class="card__image"
                id="first-article__image"
              />

              <div class="card__text card__text--big" id="first-article">
                <header>
                  <h3 id="first-article__title">
                    Как создать адаптивный дизайн за 30 минут
                  </h3>
                </header>
                <p id="first-article__content">
                  В этой статье я расскажу о ключевых принципах создания
                  мобильных интерфейсов, которые одинаково хорошо выглядят на
                  всех устройствах. Вы узнаете о медиа-запросах, гибких сетках и
                  практических примерах кода, которые можно использовать прямо
                  сейчас.
                </p>
                <time datetime="2024-12-15" id="first-article__date"
                  >Опубликовано: 15 декабря 2024</time
                >
              </div>
            </article>
          </template>

          <div
            id="blog__small-cards-placeholder"
            class="blog__small-cards-container"
          >
            <template id="small-card-template">
              <article class="card card--small">
                <img
                  class="card__delete-article-button"
                  id="small-cards__delete-article-button"
                  src="src/assets/icons/delete.svg"
                  alt=""
                />

                <img
                  src="src/assets/images/empty-picture.png"
                  alt=""
                  class="card__image"
                />

                <div class="card__text">
                  <h4 class="card__title" id="small-card-template__title">
                    Minim anim pariatur magna duis sit et dolor incididunt
                  </h4>
                  <time
                    class="card__date"
                    datetime="2024-12-15"
                    id="small-card-template__date"
                    >Опубликовано: 15 декабря 2024</time
                  >
                </div>
              </article>
            </template>
          </div>

          <div class="button-container display-none">
            <button class="blog__next-button blog__next-button--bouncing">
              Next
            </button>
          </div>
        </section>
      </section>

      <div class="admin-menu-wrapper">
        <div class="admin-menu__trigger"></div>

        <div class="admin-panel">
          <div class="admin-panel__content">
            <img
              id="open-button-for-add-post"
              class="admin-panel__button"
              src="src/assets/icons/post_add.svg"
              alt=""
              title="Добавить статью"
            />
            <img
              id="open-button-for-stats"
              class="admin-panel__button"
              src="src/assets/icons/stats.svg"
              alt=""
              title="Просмотр статистики"
            />
          </div>
        </div>
      </div>

      <!-- для добавления статей -->
      <div id="dialog-container" class="dialog-container">
        <div class="dialog">
          <img
            id="close-button-for-dialog"
            class="dialog__close-button"
            src="src/assets/icons/icons8-крестик-78.png"
            alt=""
          />
          <div class="dialog__content">
            <div id="form-bright-placeholder"></div>
          </div>
        </div>
      </div>

      <!-- для статистики -->
      <div id="stats-dialog-container" class="stats-dialog-container">
        <div class="stats-dialog">
          <img
            id="close-button-for-stats-dialog"
            class="stats-dialog__close-button"
            src="src/assets/icons/icons8-крестик-78.png"
            alt=""
          />
          <h3 class="stats-dialog__header">Статистика страницы</h3>
          <div class="stats-dialog__content">
            <div class="stats-dialog__metrics">
              <div class="metric-section" id="posts-count"></div>
              <div class="metric-section" id="comments-count">
                <h4 class="metric-section__title">Комментарии:</h4>
                <p class="metric-section__metric">0</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="footer-container" id="footer-placeholder"></div>

    <script type="module" src="src/scripts/blog-script.js"></script>
    <script type="module" src="src/scripts/include.js"></script>
    <script type="module" src="src/scripts/script.js"></script>
  </body>
</html>
